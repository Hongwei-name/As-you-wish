spring:
  config:
    # 支持在后端根目录或模块目录启动；.env 使用 KEY=value 格式，不加引号。
    import: "optional:file:../.env[.properties],optional:file:./.env[.properties]"
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:test}
  application:
    name: auth-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR}
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
        namespace: ${NACOS_NAMESPACE}
        group: ${NACOS_GROUP}
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 
      database: 0
  # 文件上传限制
  servlet:
    multipart:
          max-file-size: 10MB
          max-request-size: 50MB

server:
  port: 2003

# 阿里云号码认证 PNVS（短信认证）公共配置；AK、签名和模板按 test/prod profile 注入。
aliyun:
  pnvs:
    endpoint: ${ALIYUN_PNVS_ENDPOINT:dypnsapi.aliyuncs.com}
    country-code: "86"
    code-length: 6
    code-type: 1
    valid-time: 300
    interval: 60
    duplicate-policy: 1
    # 赠送模板 100001/100003 需要 code 和 min 两个变量；min 为有效分钟数，与 valid-time 一致。
    template-param: '{"code":"##code##","min":"5"}'
    rate-limit:
      ip-per-minute: 10
      phone-daily: 10
      ip-daily: 20

jwt:
  secret: ${JWT_SECRET}
  expire-millis: 604800000

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.asyouwish.auth.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
knife4j:
  enable: false

captcha:
  prefix: captcha
  init-default-resource: true
  expire:
    default: 10000
  local-cache-enabled: true
  local-cache-size: 20
  local-cache-wait-time: 1000
  local-cache-period: 5000
  secondary:
    enabled: false
    expire: 120000
    keyPrefix: "captcha:secondary"


minio:
  endpoint: http://127.0.0.1:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: as-you-wish
  secure: false


