spring:
  config:
    import: "optional:file:../.env[.properties],optional:file:./.env[.properties],optional:nacos:ai-service.yaml"
  application:
    name: ai-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  ai:
    # 限制 Spring AI 自身重试，避免与 WebClient 传输层重试叠加成重试风暴。
    retry:
      max-attempts: 1
      backoff:
        initial-interval: 1s
        multiplier: 2
        max-interval: 3s
    openai:
      api-key: ${OPENAI_API_KEY}
      # 供应商 origin；实际 chat 完整地址由 OPENAI_CHAT_URL 提供，避免任何硬编码路径拼接。
      base-url: ${OPENAI_BASE_URL}
      chat:
        # 完整 HTTPS 接口地址；更换供应商只需改环境变量，不修改 YAML/代码。
        completions-path: ${OPENAI_CHAT_URL}
        options:
          model: ${OPENAI_MODEL}
      embedding:
        enabled: false
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR}
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
        namespace: ${NACOS_NAMESPACE}
        group: ${NACOS_GROUP}
      config: # 配置中心
        prefix: ai-service
        file-extension: yaml
        server-addr: ${NACOS_SERVER_ADDR}
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}

assistant:
  provider: ${ASSISTANT_PROVIDER:openai-compatible}
  memory:
    max-messages: 20
  http:
    connect-timeout: 15s
    handshake-timeout: 20s
    response-timeout: 120s
    proxy-host: ${ASSISTANT_PROXY_HOST:}
    proxy-port: ${ASSISTANT_PROXY_PORT:0}

server:
  port: 2002

jwt:
  secret: ${JWT_SECRET}

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.zerok.aiservice.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
